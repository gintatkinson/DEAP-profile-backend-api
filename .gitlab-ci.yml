# ==============================================================================
# DEAP Production GitLab CI/CD Pipeline Specification
# Standard: RTCA DO-178C / DO-331 / ISO 15288 / ASTM F3269-17
# ==============================================================================

stages:
  - lint
  - verify

variables:
  TRACKER_PROVIDER: "gitlab"
  GIT_DEPTH: "50"

default:
  image: debian:bookworm-slim
  before_script:
    - which git || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)

lint:downstream-baseline:
  stage: lint
  script:
    - echo "=== Stage 1: Running Downstream Baseline Conformance Gate (Checks 10-40) ==="
    - ./target/release/verify-baseline . --no-domain

verify:model-coverage:
  stage: verify
  script:
    - echo "=== Stage 2: Running Specification Model Coverage & Parity Lock ==="
    - ./target/release/verify-baseline . --spec-only
